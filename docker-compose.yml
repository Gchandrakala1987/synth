# Local development: backend in a container, frontend on the host (Vite HMR is too good to give up).
# Run:   docker compose up --build api
# Then:  cd web && npm install && npm run dev

services:
  api:
    build:
      context: ./src/Synth.Api
      dockerfile: Dockerfile
    image: synth-api:dev
    container_name: synth-api
    ports:
      - "5080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      OPENAI__APIKEY: ${OPENAI__APIKEY:-}
      OPENAI__MODEL: ${OPENAI__MODEL:-gpt-4o-mini}
      AZUREOPENAI__ENDPOINT: ${AZUREOPENAI__ENDPOINT:-}
      AZUREOPENAI__APIKEY: ${AZUREOPENAI__APIKEY:-}
      AZUREOPENAI__DEPLOYMENT: ${AZUREOPENAI__DEPLOYMENT:-gpt-4o-mini}
      AGENT__HEADLESS: "true"
      CORS__ALLOWEDORIGINS__0: "http://localhost:5173"
    restart: unless-stopped
